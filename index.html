<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>診断士試験対策アプリ</title>
<meta name="description" content="中小企業診断士 1次試験・2次試験の学習アプリ">
<meta name="theme-color" content="#FAF7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="診断士対策">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* 1次試験のマークシートをモチーフにした画面。案内線はサーモン色、塗りは鉛筆の黒。 */
:root{
  --paper:#FAF7F6; --sheet:#FFFFFF; --ink:#24282C; --ink-2:#5B6168; --ink-3:#8C9299;
  --guide:#E6A79D; --guide-soft:#F7E2DE; --drop:#AE4A3E; --mark:#2A2F34; --on-mark:#FFFFFF;
  --good:#1C7652; --good-soft:#E2F1EA; --bad:#BF342E; --bad-soft:#FBE7E5; --warn:#8F5B00; --warn-soft:#FBEFD9;
  --font:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141719; --sheet:#1C2023; --ink:#ECEEF0; --ink-2:#A6ACB3; --ink-3:#7A8189;
    --guide:#7C4C45; --guide-soft:#352624; --drop:#EE9C8F; --mark:#E9ECEE; --on-mark:#141719;
    --good:#52C79C; --good-soft:#163227; --bad:#F2766E; --bad-soft:#3A1F1D; --warn:#E5B55E; --warn-soft:#382D17;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
a{color:var(--drop);text-underline-offset:3px}

.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;border-bottom:1px solid var(--guide)}
.cd{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;min-width:0}
.cd-l{font-size:12px;color:var(--drop);letter-spacing:.06em;font-weight:700}
.cd-n{font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd-u{font-size:13px;font-weight:700}
.cd-sub{flex-basis:100%;font-size:12px;color:var(--ink-2)}
.wk{min-width:0;flex:0 1 160px}
.wk-t{font-size:12px;color:var(--ink-2);display:flex;gap:4px;align-items:baseline;justify-content:flex-end;white-space:nowrap}
.wk-t b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--guide-soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--mark)}
.ver{display:block;margin-top:5px;font-size:11px;line-height:1;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bar-note{flex:none;font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding-block:7px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 28px}
.view{display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--drop);letter-spacing:.1em}
.sec-h span{flex:none}
.sec-h::after{content:"";flex:1;height:1px;background:var(--guide)}
.sheet{background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lead{margin:0;font-size:15px;font-weight:500;text-wrap:pretty}
.fine{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.note{margin:0;font-size:14px}
.err{margin:0;font-size:13px;color:var(--bad);font-weight:500}
.center{text-align:center}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
h2.ttl{margin:0;font-size:20px;font-weight:900;line-height:1.35;text-wrap:balance}

.dueRow,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:500}
.stat .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:13px;font-weight:700;margin-left:2px}

.btn{appearance:none;-webkit-appearance:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none}
.btn.primary{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.btn.ghost{border-color:var(--guide)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.go{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.go .btn{flex-direction:column;gap:0;line-height:1.25;padding:10px 6px;border-radius:14px}
.go .btn small{font-weight:500;font-size:11.5px;opacity:.85}
.linkbtn{appearance:none;background:none;border:none;color:var(--drop);font:inherit;font-size:13.5px;font-weight:700;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.linkbtn.danger{color:var(--bad)}
.linkbtn.inv{color:var(--on-mark);padding:4px 0;min-height:0}
.icon{appearance:none;border:1.5px solid var(--guide);background:var(--sheet);color:var(--ink);width:40px;height:40px;border-radius:50%;font:inherit;font-size:20px;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
:focus-visible{outline:2.5px solid var(--drop);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.row-act{display:flex;flex-wrap:wrap;gap:4px 16px}

.bub{display:grid;place-items:center;padding:0;border-radius:50%;border:2px solid var(--guide);background:var(--sheet);color:var(--drop);font:inherit;font-weight:700}
.bub svg{display:block}
.bub.big{width:84px;height:84px;cursor:pointer;transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
.bub.big.on{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.bub.big.ans{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--good)}
.bub.big[disabled]{cursor:default}
.bub.sm{width:22px;height:22px;border-width:1.5px}
.bub.sm.part{background:linear-gradient(to top,var(--mark) 50%,transparent 50%);border-color:var(--mark)}
.bub.sm.full{background:var(--mark);border-color:var(--mark)}
.ox{display:flex;justify-content:center;gap:44px;padding-block:4px}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.d7{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-2)}
.d7-n{font-weight:700;color:var(--ink)}
.d7.today .d7-n{color:var(--drop)}
.d7-m{font-variant-numeric:tabular-nums}

.todo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px dashed var(--guide)}
.todo-t{display:flex;flex-direction:column;min-width:0}
.todo-t b{font-weight:700}
.todo-t span{font-size:12px;color:var(--ink-2)}

.timer{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tface{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.addrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.addrow .fine{flex-basis:100%}

/* 演習・採点の全画面パネル */
.panel{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-top{flex:none;display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--guide)}
.p-title{font-weight:700;font-size:15px;min-width:0;flex:1;line-height:1.35}
.p-title small{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.dots{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--guide)}
.dots i.ok{background:var(--mark);border-color:var(--mark)}
.dots i.ng{background:var(--bad);border-color:var(--bad)}
.dots i.cur{border-color:var(--ink);border-width:2.5px}
.sbar{flex:1;min-width:0;height:6px;border-radius:3px;background:var(--guide-soft);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--mark)}
.s-count{font-weight:900;font-variant-numeric:tabular-nums;font-size:17px;flex:none}
.s-count small{font-weight:500;font-size:12px;color:var(--ink-2)}
.endbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px;background:var(--warn-soft);font-size:13.5px;font-weight:500}
.endbar span{flex-basis:100%}
.p-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.p-body{display:flex;flex-direction:column;gap:18px;padding-block:18px 24px;max-width:640px;margin:0 auto}
.s-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--guide);color:var(--drop);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.chip.draft{border-color:var(--warn);color:var(--warn)}
.s-topic{font-size:12.5px;color:var(--ink-2)}
.s-q{font-size:18px;line-height:1.8;font-weight:500;margin:0;text-wrap:pretty;white-space:pre-wrap}
.stmts{margin:0;padding:12px 14px;border-left:3px solid var(--guide);background:var(--sheet);border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.75}
.stmts p{margin:0;display:flex;gap:8px}
.stmts b{flex:none}
.fig{overflow-x:auto;background:var(--sheet);border:1px solid var(--guide);border-radius:10px;padding:8px}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{appearance:none;display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--sheet);border:1.5px solid var(--guide);border-radius:12px;padding:12px;font:inherit;font-size:15px;line-height:1.7;color:var(--ink);cursor:pointer}
.choice .lt{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--guide);display:grid;place-items:center;font-weight:700;color:var(--drop)}
.choice.on{border-color:var(--mark)}
.choice.on .lt{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.choice.ans{border-color:var(--good);box-shadow:0 0 0 1.5px var(--good)}
.choice.ans .lt{border-color:var(--good);color:var(--good)}
.choice.on.ans .lt{background:var(--good);border-color:var(--good);color:#fff}
.choice[disabled]{cursor:default}
.choice .ce{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}
.confwrap{display:flex;flex-direction:column;gap:8px}
.conf-q{margin:0;font-size:13px;color:var(--ink-2);text-align:center}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf .btn{border-radius:12px}
.res{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.res.ok{background:var(--good-soft)}
.res.ng{background:var(--bad-soft)}
.res-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;font-weight:900;font-size:18px}
.res.ok .res-h{color:var(--good)}
.res.ng .res-h{color:var(--bad)}
.res-a{font-size:13px;font-weight:700;color:var(--ink)}
.res p{margin:0;font-size:14.5px;line-height:1.75}
.res .ref{font-size:12.5px;color:var(--ink-2)}
.res-x{background:var(--sheet);border-radius:10px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.res-x p{font-size:14px}
.res-x .tx-figcap{margin-top:0}
.res-x ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7}
.p-foot{flex:none;padding-block:10px;border-top:1px solid var(--guide);background:var(--paper)}
.p-foot.two{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:16px;font-weight:700;color:var(--ink-2)}
.wr{display:flex;gap:10px;padding-block:10px;border-bottom:1px dashed var(--guide);font-size:14px}
.wr-a,.gi-a{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--good);color:var(--good);font-weight:700;font-size:14px}
.wr-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.wr-b small{font-size:12.5px;color:var(--ink-2);line-height:1.6}

/* 演習タブ */
.subjs{display:flex;flex-direction:column}
.subj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding-block:12px;border-bottom:1px dashed var(--guide)}
.subj-n{font-weight:700;appearance:none;background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--guide);text-underline-offset:4px}
.subj-m{font-size:12px;color:var(--ink-2);grid-column:1}
.subj-a{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:10px}
.acc{font-variant-numeric:tabular-nums;font-weight:900;font-size:17px;min-width:3em;text-align:right}
.toggle{appearance:none;font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;border:1.5px solid var(--guide);background:transparent;color:var(--ink-2);padding:6px 12px;min-height:36px;cursor:pointer;min-width:5.2em}
.toggle.on{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.cov{display:flex;align-items:center;gap:10px}
.cov .meter{flex:1;margin:0;height:8px;border-radius:4px}
.cov b{font-variant-numeric:tabular-nums;font-size:13px;min-width:4.5em;text-align:right}
.grp{padding-block:10px;border-bottom:1px dashed var(--guide);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.grp-n{font-weight:700;font-size:14.5px}
.grp-m{font-size:12px;color:var(--ink-2);grid-column:1}
.grp-b{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px}
/* 演習の進み具合：塗りつぶし＝正解、赤に×＝不正解、白抜き＝未回答（マークシートの塗りと同じ） */
.pbar{display:flex;height:8px;border-radius:4px;background:var(--guide-soft);overflow:hidden;min-width:0}
.pbar.big{height:12px;border-radius:6px}
.pbar i{display:block;height:100%;flex:none}
.pbar i.ok{background:var(--mark)}
.pbar i.ng{background:var(--bad)}
.subj .pbar,.grp .pbar{grid-column:1 / -1;margin-top:4px}
.subj-m b{color:var(--ink);font-variant-numeric:tabular-nums}
.alldone{color:var(--good)}
.nw{white-space:nowrap}
.acc small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-2);line-height:1.2;text-align:right}
.pnum{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pnum b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.pnum span{font-size:13px;font-weight:700;color:var(--ink-2)}
.pnum em{font-style:normal;margin-left:auto;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.plg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.plg span{display:inline-flex;align-items:center;gap:6px}
.qd{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--guide);background:var(--sheet);position:relative}
.qd.ok{background:var(--mark);border-color:var(--mark)}
.qd.ng{background:var(--bad);border-color:var(--bad)}
.qd.ng::before,.qd.ng::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:1.8px;border-radius:1px;background:var(--on-mark);transform:translate(-50%,-50%) rotate(45deg)}
.qd.ng::after{transform:translate(-50%,-50%) rotate(-45deg)}
.go2{display:flex;flex-wrap:wrap;gap:8px}
.go2 .btn{flex:1 1 0;min-width:0;flex-direction:column;gap:0;line-height:1.3;padding:10px 6px;border-radius:14px}
.go2 .btn small,.p-foot .btn small{font-weight:500;font-size:11.5px;opacity:.85}
.plink{appearance:none;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--ink-2);font-size:12.5px;cursor:pointer}
.plink b{color:var(--ink);font-variant-numeric:tabular-nums}
.plink-t{text-decoration:underline;text-decoration-color:var(--guide);text-underline-offset:3px}
.chip.st{border-color:var(--ink-3);color:var(--ink-2)}
.chip.st.new{border-color:var(--mark);color:var(--ink)}
.chip.st.ng{border-color:var(--bad);color:var(--bad)}
.ql-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ql-it{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:12px;color:var(--ink);font-weight:700;font-size:13px}
.ql-n{flex:1 1 12em;min-width:0}
.ql-m{font-weight:500;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.linkbtn.sm{font-size:12.5px;min-height:28px;padding:2px 0}
.grp ul.ql{list-style:none;margin:2px 0 0;padding:0}
.qrow{appearance:none;display:flex;align-items:flex-start;gap:10px;width:100%;min-height:44px;text-align:left;background:none;border:0;border-bottom:1px dashed var(--guide-soft);padding:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.qrow .qd{margin-top:4px}
.qtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.qq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.55}
.qm{font-size:11.5px;color:var(--ink-2)}

/* テキスト */
#reader{z-index:25}
.tx-sec{display:flex;flex-direction:column;gap:10px;padding-block:6px 20px;border-bottom:1px solid var(--guide)}
.tx-sec h3{margin:0;font-size:17px;font-weight:900;line-height:1.45;text-wrap:balance}
.tx-sec h4{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--drop)}
.tx-sec p{margin:0;font-size:15px;line-height:1.85;text-wrap:pretty}
.tx-sec ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.75}
.tx-case,.tx-point,.tx-trap{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.75;display:flex;flex-direction:column;gap:2px}
.tx-case{background:var(--sheet);border:1px solid var(--guide)}
.tx-point{background:var(--good-soft)}
.tx-trap{background:var(--warn-soft)}
.tx-case b,.tx-point b,.tx-trap b{font-size:12px;letter-spacing:.06em}
.tx-fig{margin:6px 0 0;overflow-x:auto}.tx-fig svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;color:var(--ink)}.tx-figcap{font-size:12.5px;line-height:1.6;color:var(--ink-2);text-align:left;margin-top:2px}
.tx-code{margin:6px 0 0;padding:8px 10px;background:var(--sheet);border:1px solid var(--guide);border-radius:8px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',monospace;font-size:13px;line-height:1.55;color:var(--ink)}
.tx-case b{color:var(--drop)}
.tx-point b{color:var(--good)}
.tx-trap b{color:var(--warn)}
.tx-hl h3{color:var(--drop)}
.tx-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grp details{grid-column:1 / -1;font-size:13px;color:var(--ink-2)}
.grp summary{cursor:pointer;color:var(--drop);font-weight:700;font-size:12.5px;padding-block:6px}
.grp ul{margin:6px 0 0;padding-left:1.2em}
.grp li.has{color:var(--ink)}
.part-h{font-size:13px;font-weight:900;margin:8px 0 0}
.fl{padding-block:12px;border-bottom:1px dashed var(--guide);display:flex;flex-direction:column;gap:6px;font-size:14px}
.fl small{font-size:12.5px;color:var(--ink-2)}
.back{align-self:flex-start}

/* 過去問タブ */
.pgrid{overflow-x:auto}
.pgrid table{border-collapse:collapse;width:100%;min-width:340px;font-variant-numeric:tabular-nums}
.pgrid th,.pgrid td{padding:0;text-align:center;border-bottom:1px dashed var(--guide)}
.pgrid thead th{font-size:12px;color:var(--ink-2);font-weight:700;padding-block:6px}
.pgrid tbody th{font-size:12.5px;text-align:left;white-space:nowrap;padding-right:8px;font-weight:700}
.pgrid tbody th small{display:block;font-size:10.5px;color:var(--drop);font-weight:700}
.pc{appearance:none;width:100%;min-width:40px;height:44px;border:0;background:none;font:inherit;font-weight:900;font-size:15px;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pc.none{color:var(--ink-3);font-weight:500;font-size:13px}
.pc.low{color:var(--bad)}
.pc.good{color:var(--good)}
.pc.na{color:var(--ink-3);font-weight:500;font-size:12px}
.pgrid td.mt{font-size:13px;font-variant-numeric:tabular-nums;padding-inline:2px;white-space:nowrap}
.pgrid thead th{white-space:nowrap}
.pgrid td.mt b.good{color:var(--good)}
.pgrid td.mt b.bad{color:var(--bad)}
.pgrid td.mt small{color:var(--ink-3)}
/* 模擬試験のアラート（今日のタブの先頭） */
.malert{border:1.5px solid var(--guide);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--sheet);min-width:0}
.malert.soon{border-color:var(--warn)}
.malert.today{border-color:var(--mark);border-width:2px}
.malert.over{border-color:var(--bad);border-width:2px;background:var(--bad-soft)}
.malert-h{display:flex;align-items:center;gap:8px;font-size:15.5px;line-height:1.4}
.flag{width:18px;height:18px;flex:none;color:var(--ink-2)}
.malert.soon .flag{color:var(--warn)}
.malert.today .flag{color:var(--ink)}
.malert.over .flag,.malert.over .malert-h b{color:var(--bad)}
.mday{display:flex;flex-direction:column;gap:6px}
.mday-l{font-size:12px;font-weight:700;color:var(--ink-2)}
.mday-s{display:flex;flex-wrap:wrap;gap:6px}
.mchip{appearance:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;min-height:50px;padding:4px 8px;border:1.5px solid var(--guide);border-radius:12px;background:var(--sheet);font:inherit;color:var(--ink);cursor:pointer;line-height:1.3}
.mchip span{font-weight:700;font-size:13.5px}
.mchip small{font-size:11px;color:var(--ink-2)}
.mchip.go{border-color:var(--mark);background:var(--mark);color:var(--on-mark)}
.mchip.go small{color:var(--on-mark);opacity:.85}
.mchip.done b{font-size:13px}
.mchip.done b.good{color:var(--good)}
.mchip.done b.bad{color:var(--bad)}
.mchip.na{cursor:default;color:var(--ink-3);border-style:dashed}
.tab.al .tab-dot{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.tab.al-over .tab-dot{border-color:var(--bad);background:var(--bad)}
/* 模擬試験の画面 */
.m-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-info div{border:1.5px solid var(--guide);border-radius:var(--r);padding:10px;display:flex;align-items:baseline;justify-content:center;gap:4px;background:var(--sheet)}
.m-info b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.m-info span{font-size:13px;color:var(--ink-2);font-weight:700}
.m-rules{margin:0;padding-left:1.2em;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.m-no{display:flex;align-items:baseline;gap:10px}
.m-no b{font-size:15px}
.m-no span{font-size:12px;color:var(--ink-2);font-weight:700}
.m-no .m-lv{margin-left:auto;font-weight:500}
.m-lead{border-left:3px solid var(--guide);padding:2px 0 2px 12px;font-size:14px;color:var(--ink);min-width:0}
.ptimer.warn{color:var(--bad)}
.mnav{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.mcell{appearance:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;border:1.5px solid var(--guide);border-radius:10px;background:var(--sheet);font:inherit;color:var(--ink);cursor:pointer;padding:2px}
.mcell span{font-size:11.5px;color:var(--ink-2);font-weight:700}
.mcell b{font-size:15px;min-height:1.2em}
.mcell.on{border-color:var(--mark)}
.mcell.on b{color:var(--ink)}
.mcell.cur{box-shadow:0 0 0 2px var(--drop)}
.mcell i{position:absolute;top:1px;right:4px;font-style:normal;font-size:12px;color:var(--warn)}
.mres{appearance:none;display:grid;grid-template-columns:5.6em minmax(0,1fr) auto 1.6em;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left;background:none;border:0;border-bottom:1px dashed var(--guide);padding:6px 0;font:inherit;color:var(--ink);cursor:pointer}
.mres .ms-n{font-weight:700;font-size:13px;line-height:1.3}
.mres .ms-n small{display:block;font-size:11px;color:var(--ink-2)}
.mres-a{font-size:12.5px;color:var(--ink-2)}
.mres-p{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mres b.ok{color:var(--good)}
.mres b.ng{color:var(--bad)}
.pyr{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px dashed var(--guide)}
.pyr-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pyr-h b{font-size:15px}
.pyr-h small{font-size:12px;color:var(--ink-2)}
.pyr-r{display:flex;align-items:flex-start;gap:8px}
.pyr-l{flex:none;width:2.4em;font-size:12px;font-weight:700;color:var(--ink-2);padding-top:7px}
.pyr-c{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;min-width:0}
.pyr-na{grid-column:1 / -1;font-size:12.5px;color:var(--ink-3);padding-top:6px}
.lk{display:flex;align-items:center;justify-content:center;min-height:34px;padding:0;border:1.5px solid var(--guide);border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;background:var(--sheet);white-space:nowrap}
.lk:active{background:var(--guide-soft)}
.pc.manual{font-weight:500}
.pc.na{color:var(--ink-3);font-size:11px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-2)}
.ms-row{display:grid;grid-template-columns:4.6em minmax(0,1fr);align-items:center;gap:8px;padding-block:6px;border-bottom:1px dashed var(--guide)}
.ms-n{font-size:13px;font-weight:700;line-height:1.25}
.ms-n small{display:block;font-size:11px;color:var(--ink-2);font-weight:500}
.ms-b{display:flex;gap:6px;justify-content:flex-end}
.mb{appearance:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--guide);background:var(--sheet);color:var(--drop);font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
.mb.on{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.mb.ok{box-shadow:0 0 0 2.5px var(--good)}
.mb[disabled]{cursor:default}
.ms-res{grid-column:1 / -1;font-size:12px;color:var(--ink-2);display:flex;gap:8px;justify-content:flex-end;align-items:baseline}
.ms-t{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-res b.ok{color:var(--good)}
.ms-res b.ng{color:var(--bad)}
.ptimer{font-variant-numeric:tabular-nums;font-weight:900;font-size:16px;flex:none}
.gate{display:flex;flex-direction:column;gap:12px}

/* 判定タブ */
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding-block:12px;border-bottom:1px dashed var(--guide)}
.jrow-n{font-weight:700}
.jrow-m{font-size:12.5px;color:var(--ink-2);grid-column:1 / -1;display:flex;flex-direction:column;gap:2px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;align-self:start}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--guide-soft);color:var(--ink-2)}
.checks{display:flex;flex-direction:column;gap:2px}
.checks span::before{content:"○ ";color:var(--ink-3)}
.checks span.ok::before{content:"● ";color:var(--good)}
.simbig{display:flex;align-items:baseline;gap:6px}
.simbig b{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.simbig span{font-size:14px;font-weight:700;color:var(--ink-2)}
.crit{margin:0;padding-left:1.3em;font-size:13.5px;display:flex;flex-direction:column;gap:6px}

/* 記録タブ */
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto;max-width:560px}
.chartbox .bar{fill:var(--ink-3)}
.chartbox .bar.cur{fill:var(--mark)}
.chartbox .tline{stroke:var(--drop);stroke-width:1.25;stroke-dasharray:4 3}
.chartbox .base{stroke:var(--guide);stroke-width:1}
.chartbox .ax{fill:var(--ink-2);font-size:10px;font-family:var(--font)}
.chartbox .val{fill:var(--ink);font-size:10px;font-weight:700;font-family:var(--font)}
.form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:700;min-width:0}
select,input[type=text],input[type=number],input[type=date]{font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--sheet);border:1.5px solid var(--guide);border-radius:10px;padding:8px 10px;min-height:44px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .span{grid-column:1 / -1}
.confirm{border-radius:12px;padding:12px 14px;background:var(--warn-soft);display:flex;flex-direction:column;gap:10px;font-size:13.5px}

nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--guide);background:var(--sheet);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{appearance:none;background:none;border:none;font:inherit;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;padding-block:9px 7px;font-size:11px;font-weight:700;cursor:pointer;min-height:54px;white-space:nowrap;letter-spacing:-.02em}
.tab-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--guide)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tab-dot{background:var(--mark);border-color:var(--mark)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--mark);color:var(--on-mark);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (max-width:380px){ .ox{gap:28px} .cd-n{font-size:30px} .mb{width:36px;height:36px} .ms-row{grid-template-columns:4em minmax(0,1fr)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* 1次/2次切り替え */
.stage-sw{display:flex;gap:0;border:1.5px solid var(--guide);border-radius:999px;overflow:hidden;align-self:center}
.stage-sw button{appearance:none;border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:5px 16px;cursor:pointer;min-height:32px;white-space:nowrap;transition:background-color .12s,color .12s}
.stage-sw button[aria-pressed="true"]{background:var(--mark);color:var(--on-mark)}
.stage-sw button+button{border-left:1.5px solid var(--guide)}

/* 記述式演習 */
.ex-yoken{background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r);padding:14px 16px;font-size:14.5px;line-height:1.85;white-space:pre-wrap;text-wrap:pretty}
.ex-qbox{background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ex-qbox h4{margin:0;font-size:15px;font-weight:700;color:var(--drop)}
.ex-qbox p{margin:0;font-size:15px;line-height:1.75}
.ex-ta{font:inherit;font-size:15px;line-height:1.75;color:var(--ink);background:var(--paper);border:1.5px solid var(--guide);border-radius:10px;padding:10px 12px;width:100%;min-height:80px;resize:vertical}
.ex-ta:focus{border-color:var(--drop);outline:none}
.ex-count{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.ex-count.over{color:var(--bad);font-weight:700}
.ex-model{background:var(--good-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ex-model b{font-size:12px;color:var(--good);letter-spacing:.06em}
.ex-model p{margin:0;font-size:14.5px;line-height:1.75}
.ex-model .ex-pts{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px}
.ex-model .ex-pts span{background:var(--sheet);border-radius:6px;padding:1px 8px;border:1px solid var(--guide)}
.ex-card{appearance:none;display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r);padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
.ex-card b{font-size:15px;font-weight:700}
.ex-card span{font-size:12.5px;color:var(--ink-2)}
.ex-ai{background:var(--sheet);border:1.5px solid var(--guide);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ex-ai b{font-size:12px;letter-spacing:.06em}
.ex-ai .ex-score{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.ex-ai .ex-score.good{color:var(--good)}
.ex-ai .ex-score.mid{color:var(--warn)}
.ex-ai .ex-score.low{color:var(--bad)}
.ex-ai p{margin:0;font-size:14px;line-height:1.75}
.ex-ai .ex-fb{font-size:13.5px;line-height:1.7;white-space:pre-wrap}
.ex-loading{text-align:center;padding:16px;color:var(--ink-2);font-size:13px}
.ex-apikey{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r)}
.ex-apikey input{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--guide);border-radius:8px;padding:8px 10px;width:100%;min-height:40px}
.ex-apikey input:focus{border-color:var(--drop);outline:none}

/* 事例Ⅳドリル */
.j4-cats{display:flex;flex-direction:column;gap:10px}
.j4-cat{appearance:none;display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r);padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
.j4-cat b{font-size:15px;font-weight:700}
.j4-cat span{font-size:12.5px;color:var(--ink-2)}
.j4-cat .j4-prog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.j4-cat .j4-prog em{color:var(--good);font-style:normal}
.j4-cat.off{opacity:.5;cursor:default}
/* 事例Ⅳドリル（本番形式） */
.d4-box{background:var(--sheet);border:1.5px solid var(--guide);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.d4-title{margin:0;font-size:17px;line-height:1.5}
.d4-lead p,.d4-q p,.d4-e p{margin:0 0 6px;font-size:15px;line-height:1.8;text-wrap:pretty}
.d4-h{margin:0;font-size:15px;color:var(--drop)}
.d4-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.d4-tbl{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;width:100%}
.d4-tbl caption{caption-side:top;text-align:left;font-size:12.5px;font-weight:700;color:var(--ink-2);padding-bottom:4px}
.d4-tbl th,.d4-tbl td{border-bottom:1px solid var(--guide-soft);padding:5px 8px;white-space:nowrap;text-align:right;font-weight:400}
.d4-tbl thead th{border-bottom:1.5px solid var(--guide);font-size:12.5px;color:var(--ink-2);font-weight:700}
.d4-tbl thead th:first-child,.d4-tbl tbody th{text-align:left;white-space:normal;min-width:6.5em}
.d4-note{font-size:12px;color:var(--ink-2);margin:0;font-weight:400}
.d4-f{font-size:12.5px}
.d4-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.d4-row input{width:9.5em;flex:none}
.d4-row select{width:auto;max-width:100%;flex:1 1 12em}
.d4-u{font-size:13px;color:var(--ink-2);font-weight:700;min-width:1em}
.d4-pm{font:inherit;font-size:15px;font-weight:700;min-width:36px;min-height:36px;border-radius:8px;border:1.5px solid var(--guide);background:var(--paper);color:var(--ink-2);cursor:pointer}
.d4-mk{font-size:13px;font-weight:700;flex-basis:100%}
.d4-mk.ok{color:var(--good)}
.d4-mk.ng{color:var(--bad)}
.d4-ce{font-size:13px;color:var(--bad);line-height:1.6;font-weight:400}
.d4-steps{background:var(--good-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.d4-steps b{font-size:12px;color:var(--good);letter-spacing:.06em}
.d4-steps ol{margin:0;padding-left:1.4em;font-size:14px;line-height:1.75}
.d4-clock{font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.d4-proc{min-height:96px}
.d4-nav{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <header class="top gut" id="hdr"></header>
  <div class="bar-note gut" id="note" hidden></div>
  <div class="gut" style="padding-block:8px;display:flex;justify-content:center"><div class="stage-sw" role="group" aria-label="試験の切り替え"><button type="button" data-act="stage" data-stage="s1" aria-pressed="true">1次試験</button><button type="button" data-act="stage" data-stage="s2" aria-pressed="false">2次試験</button></div></div>
  <main class="gut" id="main"><div class="view" id="view"><p class="fine">読み込んでいます…</p></div></main>
  <nav class="tabs gut" id="tabs1" aria-label="1次の画面切り替え">
    <button class="tab" type="button" data-act="tab" data-tab="today"><span class="tab-dot" aria-hidden="true"></span>今日</button>
    <button class="tab" type="button" data-act="tab" data-tab="drill"><span class="tab-dot" aria-hidden="true"></span>学習</button>

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}

function parseYmd(s){var p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);}
function startOfDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function endOfToday(){var d=new Date();d.setHours(23,59,59,999);return d.getTime();}

/* ---------- FSRS-4.5 ---------- */
var W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
var DECAY=-0.5,FACTOR=19/81,RET=0.9,MAXI=60;
function d0(g){return cl(W[4]-(g-3)*W[5],1,10);}
function fsrs(prev,g,now){
  var s,d;
  if(!prev||!prev.st){s=W[g-1];d=d0(g);}
  else{
    var t=Math.max(0,(now-(prev.last||now))/DAY);
    var r=Math.pow(1+FACTOR*t/prev.st,DECAY);
    if(g===1){s=W[11]*Math.pow(prev.df,-W[12])*(Math.pow(prev.st+1,W[13])-1)*Math.exp((1-r)*W[14]);s=Math.min(s,prev.st);}
    else{s=prev.st*(1+Math.exp(W[8])*(11-prev.df)*Math.pow(prev.st,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1));}
    d=cl(W[7]*d0(4)+(1-W[7])*(prev.df-W[6]*(g-3)),1,10);
  }
  s=Math.max(0.1,s);
  var due;
  if(g===1){due=now+10*60000;}
  else{var iv=cl(Math.round(s/FACTOR*(Math.pow(RET,1/DECAY)-1)),1,MAXI);due=startOfDay(now)+iv*DAY+4*3600000;}
  return {st:+s.toFixed(4),df:+d.toFixed(4),last:now,due:due,reps:((prev&&prev.reps)||0)+1,lapses:((prev&&prev.lapses)||0)+(g===1&&prev&&prev.st?1:0)};
}

function renderContent(src){
  var out=[],list=null,code=null;
  function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
  function closeList(){if(list){out.push('<ul>'+list.join('')+'</ul>');list=null;}}
  function closeCode(){if(code){out.push('<pre class="tx-code">'+code.join('\n')+'</pre>');code=null;}}
  String(src||'').split('\n').forEach(function(raw){
    var l=raw.trim();
    if(l.length>1&&l.charAt(0)==='`'&&l.slice(-1)==='`'){if(list)closeList();(code=code||[]).push(esc(l.slice(1,-1)));return;}
    closeCode();
    if(!l){closeList();return;}
    if(/^\*\*[^*]+\*\*$/.test(l)){closeList();out.push('<h4>'+esc(l.slice(2,-2))+'</h4>');return;}
    if(l.charAt(0)==='・'){(list=list||[]).push('<li>'+inline(l.slice(1))+'</li>');return;}
    closeList();
    if(l.indexOf('<svg')===0&&/<\/svg>$/.test(l)){out.push('<figure class="tx-fig">'+l+'</figure>');return;}
    if(l.indexOf('【図】')===0){out.push('<p class="tx-figcap">'+inline(l.slice(3))+'</p>');return;}
    if(l.indexOf('【事例】')===0){out.push('<div class="tx-case"><b>事例</b><span>'+inline(l.slice(4))+'</span></div>');return;}
    if(l.indexOf('【試験のポイント】')===0){out.push('<div class="tx-point"><b>試験のポイント</b><span>'+inline(l.slice(9))+'</span></div>');return;}

    out.push('<p>'+inline(l)+'</p>');
  });
  closeList();closeCode();return out.join('');
}

  el.innerHTML=h;
}

/* AI採点：Anthropic の Messages API を、この端末から直接呼ぶ
   ・モデルは AI_MODEL（既定は claude-sonnet-5-5）。提供が終わって見つからないときは、使えるモデルの一覧（/v1/models）から
     新しい Sonnet を選び直して1回だけやり直す（選んだモデルはこの端末に覚える）
   ・応答は、考える過程（thinking）のあとに本文が来ることがあるので、本文（type が text）だけを読む */
var AI_API='https://api.anthropic.com/v1/';
function aiHeaders(){return {'Content-Type':'application/json','x-api-key':AI_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};}
function aiErr(status,j){
  var t=(j&&j.error&&j.error.type)||'',m=String((j&&j.error&&j.error.message)||'');
  var msg=status===401?'APIキーが正しくありません。キーを設定し直してください'
    :status===403?'このAPIキーでは使えません（権限がありません）'
    :status===429?'利用の上限に達しました。少し待ってから試してください'
    :(status===529||status>=500)?'AIのサーバーが混み合っています。少し待ってから試してください'
    :status===404?'AIのモデルが見つかりません（'+m.slice(0,80)+'）'
    :'受け付けられませんでした（'+(m||('エラー '+status)).slice(0,80)+'）';
  var er=new Error(msg);er.status=status;er.type=t;er.raw=m;return er;
}
function aiFetch(path,opt){
  return fetch(AI_API+path,opt).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){if(!r.ok)throw aiErr(r.status,j);return j;});
  },function(){throw new Error('通信できませんでした。つながる場所で試してください');});
}
function aiPickModel(){
  return aiFetch('models?limit=100',{method:'GET',headers:aiHeaders()}).then(function(j){
    var ids=((j&&j.data)||[]).map(function(x){return x&&x.id;}).filter(Boolean);
    var s=ids.filter(function(id){return /sonnet/.test(id);})[0]||ids[0];
    if(!s)throw new Error('使えるAIのモデルが見つかりません');
    saveAiModel(s);return s;
  });
}
function aiMessage(prompt,maxTok){
  function once(model){return aiFetch('messages',{method:'POST',headers:aiHeaders(),body:JSON.stringify({model:model,max_tokens:maxTok||4000,messages:[{role:'user',content:prompt}]})});}
  return once(AI_MODEL).catch(function(e){
    if(e&&e.status===404&&(e.type==='not_found_error'||/model/i.test(e.raw||'')))return aiPickModel().then(once);
    throw e;
  }).then(function(j){
    var txt=((j&&j.content)||[]).filter(function(b){return b&&b.type==='text';}).map(function(b){return b.text||'';}).join('');
    if(j&&j.stop_reason==='refusal')throw new Error('AIが採点を断りました。もう一度試してください');
    if(!txt.trim())throw new Error(j&&j.stop_reason==='max_tokens'?'採点の途中で長さの上限に達しました。もう一度試してください':'採点の結果が空でした。もう一度試してください');
    return txt;
  });
}
function parseGrade(txt,max){
  var o=null;try{o=JSON.parse(txt);}catch(e){var m=txt.match(/\{[\s\S]*\}/);if(m){try{o=JSON.parse(m[0]);}catch(e2){}}}
  var sc=o&&typeof o==='object'?Math.round(Number(o.score)):NaN;
  if(!isFinite(sc))throw new Error('採点の結果を読み取れませんでした。もう一度試してください');
  function arr(a){return Array.isArray(a)?a.map(String):[];}
  return {score:Math.max(0,Math.min(max,sc)),grade:String(o.grade||'').slice(0,2),feedback:String(o.feedback||''),keywords_hit:arr(o.keywords_hit),keywords_miss:arr(o.keywords_miss),at:Date.now(),model:AI_MODEL};
}
function gradeWithAI(caseData,qData,answers){
  if(!AI_KEY)return Promise.reject(new Error('APIキーが未設定です'));
  var prompt='あなたは中小企業診断士2次試験の採点者です。以下の与件文と設問に対する受験者の解答を採点してください。\n\n';
  prompt+='【与件文】\n'+caseData.yoken+'\n\n';
  prompt+='【設問】'+qData.q+'\n（配点'+qData.score+'点、'+qData.limit+'字以内×'+qData.count+'問）\n\n';
  prompt+='【採点ポイント（キーワード）】\n'+qData.points.join('、')+'\n\n';
  prompt+='【模範解答】\n';
  qData.model.forEach(function(m,i){prompt+=(qData.labels?qData.labels[i]+'：':'')+m+'\n';});
  prompt+='\n【受験者の解答】\n';
  answers.forEach(function(a,i){prompt+=(qData.labels?qData.labels[i]+'：':'')+(a||'（未記入）')+'\n';});
  prompt+='\n以下の形式でJSON（コードブロックなし）を返してください：\n{"score":得点（0〜'+qData.score+'の整数）,"grade":"A/B/C/Dのいずれか","feedback":"良い点と改善点を含む2〜3文のフィードバック（日本語）","keywords_hit":["含まれていた採点ポイント"],"keywords_miss":["不足している採点ポイント"]}';

  return aiMessage(prompt).then(function(txt){return parseGrade(txt,qData.score);});
}

function weekStart(t){var x=new Date(t);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x;}
function weekStats(back){
  var s=weekStart(Date.now());s.setDate(s.getDate()-7*back);var min=0,days=[];
  for(var i=0;i<7;i++){var d=new Date(s);d.setDate(s.getDate()+i);var v=dayRec(ymd(d));min+=v.min||0;days.push({d:d,min:v.min||0});}
  return {start:s,min:min,days:days};
}
function weeklyTarget(){return ST.settings.wdMin*5+ST.settings.weMin*2;}
function allQ(){var a=[];SUBJ.forEach(function(s){a=a.concat(DATA.q[s.k]||[]);});return a;}
function counts(){
  var eod=endOfToday(),due=0,avail=0;
  allQ().forEach(function(q){if(ST.flags[q.id])return;var r=ST.srs[q.id];if(r){if(r.due<=eod)due++;}else if(ST.settings.active.indexOf(q.s)>=0)avail++;});
  var td=dayRec(todayKey());var quota=Math.max(0,ST.settings.newPerDay-(td.nw||0));
  return {due:due,avail:avail,newToday:Math.min(quota,avail)};
}
function subjStats(k){
  var tot=0,lr=0,due=0,att=0,cor=0,eod=endOfToday();
  (DATA.q[k]||[]).forEach(function(q){if(ST.flags[q.id])return;tot++;var r=ST.srs[q.id];if(r){lr++;if(r.due<=eod)due++;att+=r.att||0;cor+=r.cor||0;}});
  return {tot:tot,lr:lr,due:due,acc:att?Math.round(cor/att*100):null};
}
function coverage(k){
  var sub=DATA.syl.subjects.filter(function(x){return x.k===k;})[0];var items=0,withQ=0,withT=0,groups=0,gWith=0;
  var has={};(DATA.q[k]||[]).forEach(function(q){has[q.t]=(has[q.t]||0)+1;});
  sub.parts.forEach(function(p){p.groups.forEach(function(g){groups++;var any=false;g.items.forEach(function(it){items++;if(has[it.id]){withQ++;any=true;}if(hasText(k,it.id))withT++;});if(any)gWith++;});});
  return {items:items,withQ:withQ,withT:withT,groups:groups,gWith:gWith,has:has};
}
/* ---------- 演習の進み具合 ---------- */
// 問題の状態：new＝未回答、ok＝最後に解いたときに正解、ng＝最後に解いたときに不正解
function qst(id){
  var r=ST.srs[id];if(!r)return 'new';
  if(typeof r.ok==='boolean')return r.ok?'ok':'ng';
  if(!r.cor)return 'ng';if(r.cor>=r.att)return 'ok';
  return (r.due-r.last)<=11*60000?'ng':'ok';   // 正誤を残す前の記録：不正解のときは10分後に出す
}
function blankP(){return {tot:0,ok:0,ng:0,nw:0,due:0};}
function addP(p,q,eod){p.tot++;var st=qst(q.id);if(st==='new')p.nw++;else p[st]++;var r=ST.srs[q.id];if(r&&r.due<=eod)p.due++;}
function progOf(list){var p=blankP(),eod=endOfToday();list.forEach(function(q){if(!ST.flags[q.id])addP(p,q,eod);});return p;}
function progIndex(k){   // 科目・論点・細目ごとの集計を一度に作る
  var ix={sub:blankP(),g:{},it:{}},eod=endOfToday();
  (DATA.q[k]||[]).forEach(function(q){if(ST.flags[q.id])return;var g=groupOf(q.t);addP(ix.sub,q,eod);addP(ix.g[g]||(ix.g[g]=blankP()),q,eod);addP(ix.it[q.t]||(ix.it[q.t]=blankP()),q,eod);});
  return ix;
}
function pdone(p){return p.ok+p.ng;}
function nwj(a){return a.filter(Boolean).map(function(x){return '<span class="nw">'+x+'</span>';}).join('・');}
function pct(a,b){return b?Math.round(a/b*100):0;}
function pbar(p,cls){
  var t=p.tot||1;
  return '<span class="pbar'+(cls?' '+cls:'')+'" role="img" aria-label="'+p.tot+'問のうち、正解'+p.ok+'問・不正解'+p.ng+'問・未回答'+p.nw+'問"><i class="ok" style="width:'+(p.ok/t*100).toFixed(2)+'%"></i><i class="ng" style="width:'+(p.ng/t*100).toFixed(2)+'%"></i></span>';
}
function plegend(p){return '<span class="plg" aria-hidden="true"><span><i class="qd ok"></i>正解 '+p.ok+'</span><span><i class="qd ng"></i>不正解 '+p.ng+'</span><span><i class="qd"></i>未回答 '+p.nw+'</span></span>';}
function pnum(p,lab){return '<div class="pnum"><span>'+(lab||'解いた問題')+'</span><b>'+pdone(p)+'</b><span>/ '+p.tot+'問</span><em>'+pct(pdone(p),p.tot)+'%</em></div>';}
function pblock(p,lab){return pnum(p,lab)+pbar(p,'big')+plegend(p);}
// 演習の範囲：s＝科目、g＝論点（中項目）。mode：new＝未回答だけ、ng＝不正解だけ
function scopeFilter(sc){return function(q){
  if(sc.s&&q.s!==sc.s)return false;if(sc.g&&groupOf(q.t)!==sc.g)return false;
  if(sc.mode==='new'&&ST.srs[q.id])return false;if(sc.mode==='ng'&&qst(q.id)!=='ng')return false;return true;};}
function scopeName(sc){if(sc.g){var g=DATA.groups[sc.g];return g?g.g.n:'この論点';}return sc.s&&SN[sc.s]?SN[sc.s].n:'';}
function scopeProg(sc){return progOf(allQ().filter(scopeFilter({s:sc.s,g:sc.g})));}
function startScope(sc,first){if(UI.mock&&!ST.mockRun){UI.mock=null;renderMock();}if(UI.sheet){UI.sheet=null;renderSheet();}startSession(10,scopeFilter(sc),false,{scope:sc,first:first});}
function qtype(q){return q.type==='tf'?'○×':q.type==='combo'?'組み合わせ':'単答';}
function qrow(q){
  var st=qst(q.id),r=ST.srs[q.id];
  var meta=qtype(q)+'・'+(r?(r.att||0)+'回解いた・前回は'+(st==='ok'?'正解':'不正解'):'未回答');
  return '<li><button class="qrow" type="button" data-act="drill-q" data-id="'+esc(q.id)+'"><i class="qd'+(st==='new'?'':' '+st)+'" aria-hidden="true"></i><span class="qtx"><span class="qq">'+esc(q.q)+'</span><span class="qm">'+meta+'</span></span></button></li>';
}
function qlist(k,g,ix){
  var by={},gp=ix.g[g.id]||blankP();
  (DATA.q[k]||[]).forEach(function(q){if(!ST.flags[q.id]&&groupOf(q.t)===g.id)(by[q.t]=by[q.t]||[]).push(q);});
  var h=(gp.nw||gp.ng)?'<div class="ql-act">'+(gp.nw?'<button class="btn small primary" type="button" data-act="drill-new" data-g="'+g.id+'">未回答を解く（'+gp.nw+'問）</button>':'')+(gp.ng?'<button class="btn small" type="button" data-act="drill-ng" data-g="'+g.id+'">間違えた問題を解き直す（'+gp.ng+'問）</button>':'')+'</div>':'';
  g.items.forEach(function(it){
    var qs=(by[it.id]||[]).sort(function(a,b){return (a.n||0)-(b.n||0);}),ip=ix.it[it.id]||blankP();
    h+='<div class="ql-it"><span class="ql-n">'+esc(it.n)+'</span><span class="ql-m">'+(qs.length?pdone(ip)+'/'+qs.length+'問':'問題なし')+'</span>'+(hasText(k,it.id)?'<button class="linkbtn sm" type="button" data-act="open-text" data-s="'+k+'" data-sec="'+esc(it.id)+'">テキスト</button>':'')+'</div>';
    if(qs.length)h+='<ul class="ql">'+qs.map(qrow).join('')+'</ul>';
  });
  return h;
}
function weakTopics(n){
  var m={};
  Object.keys(ST.srs).forEach(function(id){var q=DATA.qById[id];if(!q||ST.flags[id])return;var r=ST.srs[id];var g=groupOf(q.t);var o=m[g]||(m[g]={g:g,s:q.s,att:0,cor:0,cw:0});o.att+=r.att||0;o.cor+=r.cor||0;o.cw+=r.cw||0;});
  return Object.keys(m).map(function(k){return m[k];}).filter(function(o){return o.att>=3;}).map(function(o){o.acc=Math.round(o.cor/o.att*100);return o;})
    .filter(function(o){return o.acc<80||o.cw>0;}).sort(function(a,b){return (a.acc-b.acc)||(b.cw-a.cw);}).slice(0,n);
}

/* ---------- 過去問 ---------- */
function pastYear(y){return DATA.past.years.filter(function(e){return e.y===+y;})[0];}
function isReserve(y){return (DATA.past.reserve||[]).indexOf(+y)>=0;}
function attemptsOf(s,y){return ST.past.filter(function(a){return a.s===s&&(y==null||a.y===+y);}).sort(function(a,b){return a.at-b.at;});}
function keyOk(item,mark){if(item.a==='*')return true;if(!mark)return false;return item.a.split('/').indexOf(mark)>=0;}
function scoreSheet(items,marks){var sc=0,ok=0;items.forEach(function(it){if(keyOk(it,marks[it.n])){sc+=it.p;ok++;}});return {score:sc,ok:ok};}
function judgeSubject(s){
  var res={s:s,practice:[],practiceOK:false,reserve:[],reserveOK:false,reserveDone:false,status:'none'};
  var byYear={};ST.past.filter(function(a){return a.s===s&&!isReserve(a.y);}).sort(function(a,b){return b.at-a.at;}).forEach(function(a){if(!byYear[a.y])byYear[a.y]=a;});
  var latest=Object.keys(byYear).map(function(y){return byYear[y];}).sort(function(a,b){return b.at-a.at;}).slice(0,2);
  res.practice=latest;res.practiceOK=latest.length===2&&latest.every(function(a){return a.score>=PASS;});
  var rs=(DATA.past.reserve||[]).map(function(y){var f=attemptsOf(s,y)[0];return {y:y,first:f||null};});
  res.reserve=rs;res.reserveDone=rs.every(function(r){return r.first;});res.reserveOK=res.reserveDone&&rs.every(function(r){return r.first.score>=PASS;});
  var any=ST.past.some(function(a){return a.s===s;});
  res.status=res.practiceOK&&res.reserveOK?'done':(res.reserveDone&&!res.reserveOK?'fail':(res.practiceOK?'ready':(any?'work':'none')));
  return res;
}

function acc(id){var r=ST.srs[id];return r&&r.att?r.cor/r.att:0;}
function interleave(ids){
  var by={};ids.forEach(function(id){var s=(DATA.qById[id]||{}).s;(by[s]=by[s]||[]).push(id);});
  var keys=Object.keys(by),out=[],last=null;
  while(out.length<ids.length){keys.sort(function(a,b){return by[b].length-by[a].length;});var k=keys.filter(function(x){return by[x].length&&x!==last;})[0]||keys.filter(function(x){return by[x].length;})[0];out.push(by[k].shift());last=k;}
  return out;
}
function buildQueue(n,filter,ahead){
  var eod=endOfToday(),pool=allQ().filter(function(q){return !ST.flags[q.id]&&(!filter||filter(q));});
  var q=pool.filter(function(x){var r=ST.srs[x.id];return r&&r.due<=eod;}).sort(function(a,b){return ST.srs[a.id].due-ST.srs[b.id].due;}).slice(0,n).map(function(x){return x.id;});
  if(q.length<n){
    var td=dayRec(todayKey()),quota=(filter||ahead)?n:Math.max(0,ST.settings.newPerDay-(td.nw||0));
    var fresh=pool.filter(function(x){return !ST.srs[x.id]&&(filter||ST.settings.active.indexOf(x.s)>=0);}).sort(function(a,b){return (a.n||0)-(b.n||0);});

function mockKey(act,b){

    case 'mk-close':if(run&&m&&(m.phase==='exam'||m.phase==='list'))toast('閉じても時間は進みます');closeMock();return true;
    case 'mk-early':if(m){m.early=true;renderMock();}return true;
    case 'mk-start':startMock();return true;
    case 'mk-pick':{if(!m||!run)return true;var set=DATA.mset[m.s+'-'+m.r],it=set.items[m.i],v=+b.dataset.v;if(run.ans[it.no]===v)delete run.ans[it.no];else run.ans[it.no]=v;save();renderMock();return true;}
    case 'mk-prev':if(m&&m.i>0){m.i--;if(run)run.i=m.i;save();renderMock();var sp=$('#mock .p-scroll');if(sp)sp.scrollTop=0;}return true;
    case 'mk-next':{var st2=m&&DATA.mset[m.s+'-'+m.r];if(m&&st2&&m.i<st2.items.length-1){m.i++;if(run)run.i=m.i;save();renderMock();var sn=$('#mock .p-scroll');if(sn)sn.scrollTop=0;}return true;}
    case 'mk-flag':{if(!m||!run)return true;var it3=DATA.mset[m.s+'-'+m.r].items[m.i];run.flag=run.flag||{};if(run.flag[it3.no])delete run.flag[it3.no];else run.flag[it3.no]=1;save();renderMock();return true;}
    case 'mk-list':if(m){m.phase=m.phase==='list'?'exam':'list';m.confirm=false;renderMock();}return true;
    case 'mk-goto':if(m){m.i=+b.dataset.i;if(run)run.i=m.i;m.phase='exam';save();renderMock();}return true;
    case 'mk-confirm':if(m){m.confirm=true;renderMock();}return true;
    case 'mk-cancel':if(m){m.confirm=false;renderMock();}return true;
    case 'mk-submit':submitMock(false);return true;
    case 'mk-rv':if(m){m.i=+b.dataset.i;m.phase='review';renderMock();var sr=$('#mock .p-scroll');if(sr)sr.scrollTop=0;}return true;

function renderJContent(content){
  // Convert markdown-like content to HTML
  var lines=content.split('\n'),h='',inP=false;
  lines.forEach(function(ln){
    if(ln.startsWith('<svg')||ln.startsWith('<')){
      if(inP){h+='</p>';inP=false;}
      h+='<div class="tx-fig">'+ln+'</div>';
    } else if(ln.startsWith('**')&&ln.endsWith('**')){
      if(inP){h+='</p>';inP=false;}
      h+='<h4>'+esc(ln.slice(2,-2))+'</h4>';
    } else if(ln.startsWith('- ')){
      if(inP){h+='</p>';inP=false;}
      h+='<p style="padding-left:1em;text-indent:-1em">・'+esc(ln.slice(2))+'</p>';
    } else if(ln.trim()===''){
      if(inP){h+='</p>';inP=false;}
    } else {
      if(!inP){h+='<p>';inP=true;}else{h+='<br>';}
      h+=esc(ln).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    }
  });
  if(inP)h+='</p>';
  return h;
}

/* 事例Ⅳドリル：本番形式（数値・指標・計算過程・記述を書いて答え合わせ）と、旧形式（4択、fmt:'mc'）を同じ一覧に出す */
var D4LV={1:'基本',2:'本試験',3:'難しめ'};
function j4List(cat){return DATA2.j4?DATA2.j4.problems.filter(function(p){return p.cat===cat;}):[];}
function d4Num(s){
  s=String(s==null?'':s).trim().replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);})
    .replace(/[，,\s]/g,'').replace(/．/g,'.').replace(/^[−－ー‐▲△]/,'-').replace(/^\+/,'')
    .replace(/(百万円|千円|万円|円|%|％|回|倍|年|か月|ヶ月|個|台|件|人|時間)$/,'');
  return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN;
}
function d4Round(a,dp){var m=Math.pow(10,dp||0);return (a<0?-1:1)*Math.round(Math.abs(a)*m+1e-7)/m;}
function d4Eq(x,ans,dp){return isFinite(x)&&Math.abs(x-d4Round(ans,dp))<Math.pow(10,-(dp||0))/1000;}
function d4Unit(nm){return /回転率/.test(nm)?'回':/レシオ/.test(nm)?'倍':'%';}
function d4Fmt(v,dp){return Number(v).toLocaleString('ja-JP',{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0});}
function d4Perms(n){if(n<=1)return [[0].slice(0,n)];var out=[];d4Perms(n-1).forEach(function(q){for(var i=0;i<=q.length;i++){var r=q.slice();r.splice(i,0,n-1);out.push(r);}});return out;}
function d4Check(p,v){
  var res={};
  p.parts.forEach(function(pt){
    var used={},grps={};
    pt.fields.forEach(function(f){
      var k=f.k;
      if(f.type==='num'){var x=d4Num(v[k]);res[k]=d4Eq(x,f.ans,f.dp)||(f.alt||[]).some(function(a){return d4Eq(x,a,f.dp);});}
      else if(f.type==='ind'&&f.grp){(grps[f.grp]=grps[f.grp]||[]).push(f);}
      else if(f.type==='ind'){var nm=v[k+'_n']||'',a=f.accept[nm];res[k]=!!a&&!used[nm]&&d4Eq(d4Num(v[k+'_v']),a.v,f.dp);if(nm)used[nm]=1;}
      else if(f.type==='choice'){res[k]=v[k]===f.ans;}
    });
    // 同じ区分（grp）の欄：記入の順を問わない。入れた指標を欄（観点ごとの正解の枠）に割り当て、正解が最も多くなる組み合わせで採点する
    Object.keys(grps).forEach(function(g){
      var F=grps[g],seen={},ans=F.map(function(f){var nm=v[f.k+'_n']||'',dup=!!(nm&&seen[nm]);if(nm)seen[nm]=1;return {nm:dup?'':nm,x:d4Num(v[f.k+'_v'])};});
      var best=null,bs=-1;
      d4Perms(F.length).forEach(function(pm){var sc=0,r=pm.map(function(j,i){var a=F[j].accept[ans[i].nm];var ok=!!a&&d4Eq(ans[i].x,a.v,F[j].dp);if(ok)sc++;return ok;});if(sc>bs){bs=sc;best=r;}});
      F.forEach(function(f,i){res[f.k]=best[i];});
    });
  });
  return res;
}
function d4State(p){
  if(p.fmt==='mc'){var o=ST2.j4[p.id];return o?(o.cor>0?'ok':'ng'):'new';}
  var r=ST2.dr[p.id],c=r&&r.chk&&r.chk.res,ks=c?Object.keys(c):[];
  return !ks.length?'new':ks.every(function(k){return c[k];})?'ok':'ng';
}
function d4Tries(p){if(p.fmt==='mc'){var o=ST2.j4[p.id];return o?o.att:0;}var n=0;for(var k in ST2.log){var l=ST2.log[k];if(l&&l.k==='d4'&&l.p===p.id)n++;}return n;}
function d4Paras(t){return String(t||'').split('\n').filter(function(x){return x.trim();}).map(function(x){return '<p>'+esc(x)+'</p>';}).join('');}
function d4Table(t){
  var h='<div class="d4-tw"><table class="d4-tbl">'+(t.cap?'<caption>'+esc(t.cap)+(t.unit?'（単位：'+esc(t.unit)+'）':'')+'</caption>':'');
  h+='<thead><tr>'+t.head.map(function(c){return '<th scope="col">'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  t.rows.forEach(function(r){h+='<tr>'+r.map(function(c,i){return i?'<td>'+esc(c)+'</td>':'<th scope="row">'+esc(c)+'</th>';}).join('')+'</tr>';});
  h+='</tbody></table></div>'+(t.note?'<p class="d4-note">'+esc(t.note)+'</p>':'');
  return h;
}
function d4Field(p,f,v,chk){
  var k=f.k,id=' data-d4="'+esc(p.id)+'" data-k="',h='<div class="field d4-f">';
  function mk(ok,ng){return chk?'<span class="d4-mk '+(ok?'ok':'ng')+'">'+(ok?'○ 正解':'× '+esc(ng))+'</span>':'';}
  if(f.type==='num'){
    h+='<span>'+esc(f.label)+'</span><div class="d4-row"><input type="text" inputmode="decimal" autocomplete="off"'+id+esc(k)+'" value="'+esc(v[k]||'')+'" aria-label="'+esc(f.label)+'">'
      +'<button class="d4-pm" type="button" data-act="d4-pm" data-d4p="'+esc(p.id)+'" data-k="'+esc(k)+'" aria-label="符号（マイナス）を付ける・外す">±</button>'   // スマホの数字キーに「−」がないとき用
      +'<span class="d4-u">'+esc(f.unit||'')+'</span>'+mk(chk&&chk[k],'正解は '+d4Fmt(f.ans,f.dp)+(f.unit||''))+'</div>';
  } else if(f.type==='ind'){
    var nm=v[k+'_n']||'',inds=(DATA2.j4&&DATA2.j4.inds)||[];
    h+='<span>'+esc(f.label)+'</span><div class="d4-row"><select'+id+esc(k)+'_n" aria-label="'+esc(f.label)+'の指標"><option value="">指標を選ぶ</option>'+inds.map(function(n){return '<option'+(n===nm?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>'
      +'<input type="text" inputmode="decimal" autocomplete="off"'+id+esc(k)+'_v" value="'+esc(v[k+'_v']||'')+'" aria-label="'+esc(f.label)+'の値"><span class="d4-u">'+(nm?d4Unit(nm):'')+'</span></div>';
    if(chk){var A={};(f.grp?p.parts.reduce(function(L,pt){return L.concat(pt.fields.filter(function(x){return x.grp===f.grp&&x.type==='ind';}));},[]):[f]).forEach(function(x){Object.keys(x.accept).forEach(function(n){A[n]=x.accept[n];});});
      var acc=Object.keys(A).map(function(n){return n+'（'+d4Fmt(A[n].v,f.dp)+A[n].u+'）';}).join('、');
      h+=chk[k]?mk(true)+(Object.keys(A).length>1?'<span class="d4-note">認める指標'+(f.grp?'（'+esc(f.grp)+'の欄。観点の違うものを1つずつ）':'')+'：'+esc(acc)+'</span>':''):mk(false,'認める指標'+(f.grp?'（'+f.grp+'の欄。観点の違うものを1つずつ）':'')+'：'+acc);}
  } else if(f.type==='choice'){
    h+='<span>'+esc(f.label)+'</span><div class="d4-row"><select'+id+esc(k)+'" aria-label="'+esc(f.label)+'"><option value="">選ぶ</option>'+f.opts.map(function(o){return '<option'+(o===v[k]?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>'+mk(chk&&chk[k],'正解は '+f.ans)+'</div>';
  } else {
    var val=v[k]||'',lim=f.type==='text'?f.limit:0;
    h+='<span>'+esc(f.label)+(lim?'（'+lim+'字以内）':'')+'</span><textarea class="ex-ta'+(f.type==='proc'?' d4-proc':'')+'" rows="'+(f.type==='proc'?4:3)+'"'+id+esc(k)+'"'+(lim?' data-lim="'+lim+'"':'')+'>'+esc(val)+'</textarea>';
    if(lim)h+='<div class="ex-count'+(val.length>lim?' over':'')+'">'+val.length+' / '+lim+'字</div>';
    if(chk&&f.type==='text')h+='<div class="ex-model"><b>模範解答</b><p>'+esc(f.model)+'</p><b>採点の観点</b><div class="ex-pts">'+(f.points||[]).map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div></div>';
  }
  if(chk&&(f.type==='num'||f.type==='ind'||f.type==='choice')&&!chk[k]&&p.ce&&p.ce[k])h+='<div class="d4-ce">'+esc(p.ce[k])+'</div>';
  return h+'</div>';
}

// 記録の合わせ方
// ・演習の記録（srs）：問題ごとに、復習の予定などは最後に解いた時刻（last）が新しいほう。解いた回数・正解の回数（att・cor・reps・lapses）は、

// ・過去問・模擬試験の結果：id で合わせる（どちらの端末の結果も残す）
// ・報告（flags）：報告した時刻と、演習に戻した時刻（flagDel）の新しいほう

// 保存先：users/{uid}/sync/state（j に上の記録の JSON）、users/{uid}/days/{端末のid}（j に学習時間の JSON）、users/{uid}/sync/s2（j に2次の記録の JSON。合わせ方は sync2 の上）

var FB_CFG={apiKey:'AIzaSyD8VO0NT190-oLpS3qwiKtaAIc-EfzBk0c',authDomain:'shindannshi-app.firebaseapp.com',projectId:'shindannshi-app',storageBucket:'shindannshi-app.firebasestorage.app',messagingSenderId:'582946048152',appId:'1:582946048152:web:5bc45f4a859137e501a8ed'};

function dayRec(k){var o={min:0,ans:0,cor:0,nw:0},L=[ST.days];Object.keys(ST.daysX||{}).forEach(function(d){L.push(ST.daysX[d]);});L.forEach(function(D){var v=D&&D[k];if(v){o.min+=v.min||0;o.ans+=v.ans||0;o.cor+=v.cor||0;o.nw+=v.nw||0;}});return o;}
function allDayKeys(){var m={},L=[ST.days];Object.keys(ST.daysX||{}).forEach(function(d){L.push(ST.daysX[d]);});L.forEach(function(D){Object.keys(D||{}).forEach(function(k){m[k]=1;});});return Object.keys(m);}
function syncPart(S){return JSON.parse(JSON.stringify({srs:S.srs||{},past:S.past||[],mock:S.mock||[],flags:S.flags||{},flagDel:S.flagDel||{},settings:S.settings||{},settingsAt:S.settingsAt||0}));}
// base：問題の id ごとの [att,cor,reps,lapses]（前の同期でクラウドにあった値）。{} は「前の同期なし」＝両方の回数を足す。null は「わからない」＝多いほう
var CNT=['att','cor','reps','lapses'];
function cntOf(srs){var c={};Object.keys(srs||{}).forEach(function(k){var r=srs[k]||{};c[k]=CNT.map(function(f){return r[f]||0;});});return c;}
function mergeSync(L,R,base){
  L=L||{};if(!R)return syncPart(L);
  var o={srs:{},past:[],mock:[],flags:{},flagDel:{},settings:{},settingsAt:0},ls=L.srs||{},rs=R.srs||{};
  Object.keys(ls).concat(Object.keys(rs)).forEach(function(k){if(o.srs.hasOwnProperty(k))return;var a=ls[k],b=rs[k];
    if(!a||!b){o.srs[k]=a||b;return;}
    var n=((a.last||0)>(b.last||0)||((a.last||0)===(b.last||0)&&(a.reps||0)>(b.reps||0)))?a:b,x=Object.assign({},n),same=(a.last||0)===(b.last||0)&&(a.reps||0)===(b.reps||0);
    CNT.forEach(function(f,i){var av=a[f]||0,bv=b[f]||0,hi=Math.max(av,bv);x[f]=(same||!base)?hi:Math.max(hi,av+bv-((base[k]&&base[k][i])||0));});
    o.srs[k]=x;});
  function rk(r){return r.id||[r.s,r.y,r.r,r.at].join('|');}
  function uni(x,y){var m={},out=[];(x||[]).concat(y||[]).forEach(function(r){if(!r)return;var k=rk(r);if(m[k])return;m[k]=1;out.push(r);});return out.sort(function(p,q){return (p.at||0)-(q.at||0);});}
  o.past=uni(L.past,R.past);o.mock=uni(L.mock,R.mock);
  var lf=L.flags||{},rf=R.flags||{},ld=L.flagDel||{},rd=R.flagDel||{},fk={};
  function fat(x){return x?(x.at||1):0;}
  [lf,rf,ld,rd].forEach(function(m){Object.keys(m).forEach(function(k){fk[k]=1;});});
  Object.keys(fk).forEach(function(k){var fa=Math.max(fat(lf[k]),fat(rf[k])),da=Math.max(ld[k]||0,rd[k]||0);if(fa>da)o.flags[k]={at:fa};if(da)o.flagDel[k]=da;});
  var la=L.settingsAt||0,ra=R.settingsAt||0;
  if(la>ra){o.settings=L.settings||{};o.settingsAt=la;}else{o.settings=R.settings||L.settings||{};o.settingsAt=ra;}

function baseGet(u){try{var o=JSON.parse(lsGet('-base')||'null');return o&&o.uid===u?o.c:null;}catch(e){return null;}}
function baseSet(u,srs){lsSet('-base',JSON.stringify({uid:u,c:cntOf(srs)}));}
function putSync(mg){ST.srs=mg.srs||{};ST.past=mg.past||[];ST.mock=mg.mock||[];ST.flags=mg.flags||{};ST.flagDel=mg.flagDel||{};ST.settings=Object.assign({},DEF,mg.settings||{});ST.settingsAt=mg.settingsAt||0;}
/* 2次の記録（ST2）：users/{uid}/sync/s2 に、1次とは別に保存する
   ・記述の答え（ex）：事例・設問ごとに、書いた時刻（at）が新しいほう。同じなら、採点の時刻（grade.at）が新しいほう
   ・事例Ⅳドリルの入力（dr）：問題ごとに、書いた時刻が新しいほう
   ・解いた記録（log）：id で合わせる（両方の端末の分を残す）
   ・旧形式のドリルの回数（j4）：多いほう
   2次の記録は消さずに必ず合わせる（はじめての同期で「クラウドの記録にする」を選んでも、2次は合わせる） */
function sync2Part(S){S=S||{};return JSON.parse(JSON.stringify({ex:S.ex||{},dr:S.dr||{},log:S.log||{},j4:S.j4||{}}));}
function merge2(L,R){
  L=sync2Part(L);if(!R)return L;R=sync2Part(R);
  function newer(a,b){if(!a)return b;if(!b)return a;var x=a.at||0,y=b.at||0;if(x!==y)return x>y?a:b;var ga=(a.grade&&a.grade.at)||(a.grade?1:0),gb=(b.grade&&b.grade.at)||(b.grade?1:0);return gb>ga?b:a;}
  var o={ex:{},dr:{},log:{},j4:{}};
  Object.keys(L.ex).concat(Object.keys(R.ex)).forEach(function(c){if(o.ex[c])return;var a=L.ex[c]||{},b=R.ex[c]||{},m={};Object.keys(a).concat(Object.keys(b)).forEach(function(q){m[q]=newer(a[q],b[q]);});o.ex[c]=m;});
  Object.keys(L.dr).concat(Object.keys(R.dr)).forEach(function(p){o.dr[p]=newer(L.dr[p],R.dr[p]);});
  Object.keys(L.log).concat(Object.keys(R.log)).forEach(function(k){o.log[k]=L.log[k]||R.log[k];});
  Object.keys(L.j4).concat(Object.keys(R.j4)).forEach(function(p){var a=L.j4[p]||{},b=R.j4[p]||{};o.j4[p]={att:Math.max(a.att||0,b.att||0),cor:Math.max(a.cor||0,b.cor||0),last:Math.max(a.last||0,b.last||0)};});
  return JSON.parse(JSON.stringify(o));
}
function put2(mg){ST2.ex=mg.ex||{};ST2.dr=mg.dr||{};ST2.log=mg.log||{};ST2.j4=mg.j4||{};}
function sync2(M,u,dv){
  var F=M.F,ref=F.doc(M.db,'users',u.uid,'sync','s2'),mine=sync2Part(ST2);
  return F.runTransaction(M.db,function(tx){return tx.get(ref).then(function(s){
    var R=null;if(s.exists()){try{R=JSON.parse(s.data().j||'null');}catch(e){R=null;}}
    var mg=merge2(mine,R);tx.set(ref,{v:1,j:JSON.stringify(mg),at:Date.now(),dev:dv});return mg;});
  }).then(function(mg){put2(merge2(sync2Part(ST2),mg));try{localStorage.setItem('shindan2',JSON.stringify(ST2));}catch(e){}});   // 同期の途中で書いた分も残す
}

  return c==='auth/popup-blocked'?'ログインの画面を開けませんでした（ポップアップを許可してください）'

// mode：なし＝ふつうの同期、'merge'＝はじめての同期で「合わせる」、'cloud'＝はじめての同期で「クラウドの記録にする」
function syncNow(mode){
  clearTimeout(SYNC.t);

  var chk=(first&&!mode)?F.getDoc(ref).then(function(s){return s.exists()?s.data():null;}):Promise.resolve(null);

    return F.runTransaction(M.db,function(tx){return tx.get(ref).then(function(s){
      var R=null;if(s.exists()){try{R=JSON.parse(s.data().j||'null');}catch(e){R=null;}}
